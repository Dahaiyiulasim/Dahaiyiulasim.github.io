<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{--bg:#F4F7F3;--card:#fff;--ink:#10261A;--muted:#4A5B52;--brand:#0E5A2B;--bright:#3DDC57;--onbright:#0A2E1A;--soft:#E3EDE3;--line:#C9D8CC;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1A12;--card:#14261B;--ink:#E8F3EA;--muted:#9DB5A5;--brand:#7DEB91;--soft:#1D3526;--line:#2C4A38}}
:root[data-theme="dark"]{--bg:#0C1A12;--card:#14261B;--ink:#E8F3EA;--muted:#9DB5A5;--brand:#7DEB91;--soft:#1D3526;--line:#2C4A38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow','Helvetica Neue',Arial,sans-serif;font-size:17px;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
.cond{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700}
.top{position:relative;background:#0E5A2B;color:#fff;padding:28px 20px 24px;margin:0 -16px 20px}
.top .k{font-size:14px;letter-spacing:3px;color:#CFE8D5;font-weight:500}
.top .rota{margin-top:12px;font-size:15px;line-height:1.5;color:#CFE8D5}
.top h1{margin:2px 0 0;font-size:44px;line-height:1.05}
.top .t{font-size:24px;letter-spacing:6px;color:#7DEB91;line-height:1.1}
.top .ts{font-size:14px;letter-spacing:3px;color:#CFE8D5;font-weight:500;margin-bottom:14px}
.back{display:inline-block;color:#CFE8D5;text-decoration:none;font-size:16px;margin-bottom:12px;padding:6px 0;min-height:32px}
.card{display:block;width:100%;text-align:left;background:var(--card);border:0;border-radius:14px;padding:16px;margin-bottom:12px;color:inherit;font:inherit;text-decoration:none;cursor:pointer}
.card .row{display:flex;gap:14px;align-items:flex-start}
.badge{flex:none;min-width:64px;height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--bright);color:var(--onbright);font-size:32px;padding:0 8px}
.route{font-size:18px;font-weight:500;margin:0}
.go{margin-top:10px;color:var(--brand);font-weight:600;font-size:16px}
.tabs{display:flex;background:var(--soft);border-radius:12px;padding:4px;margin:16px 0 14px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:600 16px 'Barlow',Arial,sans-serif;padding:11px 8px;border-radius:9px;cursor:pointer;min-height:44px}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink)}
.next{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.next small{display:block;color:var(--muted);font-size:14px}
.next b{font-size:34px;line-height:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.chip{background:var(--card);border-radius:10px;text-align:center;padding:10px 0;font-size:22px}
.chip.past{opacity:.4}
.chip.nx{background:var(--bright);color:var(--onbright);opacity:1}
.note{background:var(--soft);border-radius:12px;padding:12px 16px;margin-top:14px;font-size:16px}
h2{font-size:15px;letter-spacing:3px;color:var(--muted);font-weight:600;margin:28px 0 12px}
ol.stops{list-style:none;margin:0;padding:0}
ol.stops li{position:relative;padding:0 0 18px 30px;font-size:18px}
ol.stops li:before{content:"";position:absolute;left:7px;top:8px;bottom:-8px;width:3px;background:var(--line)}
ol.stops li:last-child:before{display:none}
ol.stops li:after{content:"";position:absolute;left:0;top:5px;width:17px;height:17px;border-radius:50%;background:var(--card);border:3px solid var(--brand)}
ol.stops li.here:after{background:var(--bright)}
ol.stops li.here{font-weight:600}
.here small{display:inline-block;margin-left:8px;background:var(--bright);color:var(--onbright);border-radius:6px;padding:0 8px;font-size:13px;font-weight:600}
.chip.st:not(.nx){color:#C62828}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.st:not(.nx){color:#FF8A8A}}
:root[data-theme="dark"] .chip.st:not(.nx){color:#FF8A8A}
.nm{font-size:22px;font-weight:600}
.mbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip.sg:not(.nx){color:#1B7F37}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.sg:not(.nx){color:#5BE37A}}
:root[data-theme="dark"] .chip.sg:not(.nx){color:#5BE37A}
.chip.mk:not(.nx){color:#C62828}
.chip.mp:not(.nx){color:#B5179E}
.chip.my:not(.nx){color:#1B7F37}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.mk:not(.nx){color:#FF8A8A}:root:not([data-theme="light"]) .chip.mp:not(.nx){color:#FF8AE2}:root:not([data-theme="light"]) .chip.my:not(.nx){color:#5BE37A}}
:root[data-theme="dark"] .chip.mk:not(.nx){color:#FF8A8A}:root[data-theme="dark"] .chip.mp:not(.nx){color:#FF8AE2}:root[data-theme="dark"] .chip.my:not(.nx){color:#5BE37A}
.chip.mm:not(.nx){color:#1565C0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.mm:not(.nx){color:#7DB4FF}}
:root[data-theme="dark"] .chip.mm:not(.nx){color:#7DB4FF}
.gel{--tc:34,160,70;--ta:.14;background-color:var(--card);background-image:linear-gradient(rgba(var(--tc),var(--ta)),rgba(var(--tc),var(--ta)));border-radius:14px;padding:14px 16px;margin-bottom:10px}
.gel.ti{--tc:225,160,0;--ta:.17}
.gel.td{--tc:215,60,60;--ta:.13}
.gtur{display:inline-block;margin-left:8px;border-radius:6px;padding:0 6px;font-size:12px;font-weight:600;color:var(--ink);background:rgba(var(--tc),.26)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gel{--tc:61,220,87;--ta:.16}:root:not([data-theme="light"]) .gel.ti{--tc:255,200,60;--ta:.16}:root:not([data-theme="light"]) .gel.td{--tc:255,110,110;--ta:.17}}
:root[data-theme="dark"] .gel{--tc:61,220,87;--ta:.16}:root[data-theme="dark"] .gel.ti{--tc:255,200,60;--ta:.16}:root[data-theme="dark"] .gel.td{--tc:255,110,110;--ta:.17}
.geltarih{font-size:14px;color:var(--muted);font-weight:500}
.yeni{margin-left:8px;background:var(--bright);color:var(--onbright);border-radius:6px;padding:0 6px;font-size:12px;font-weight:600}
.gelbaslik{font-size:18px;font-weight:600;margin-top:2px}
.gelmetin{font-size:16px;margin-top:2px}
.gelbtn{display:block;width:100%;padding:12px;border:0;border-radius:12px;background:var(--soft);color:var(--ink);font:600 16px 'Barlow',Arial,sans-serif;cursor:pointer;min-height:44px}
.hata{display:block;margin:28px 0 8px;padding:12px 16px;text-align:center;border-radius:12px;background:var(--soft);color:var(--ink);font-weight:600;text-decoration:none}
.opp{display:block;margin:-6px 0 18px;padding:8px 0;color:var(--brand);font-weight:600;text-decoration:none}
.ara{display:block;width:100%;margin:0 0 18px;padding:13px 16px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:500 17px 'Barlow',Arial,sans-serif;min-height:48px;-webkit-appearance:none;appearance:none}
.ara:focus{outline:none;border-color:var(--brand)}
.srsub{font-size:15px;color:var(--muted);margin-top:2px}
.yonbtn{display:block;width:100%;margin:0 0 14px;padding:11px 12px;border:2px solid var(--brand);border-radius:12px;background:var(--card);color:var(--brand);font:600 17px 'Barlow',Arial,sans-serif;text-align:center;cursor:pointer;min-height:48px}
.yonbtn small{display:block;font-size:14px;font-weight:500;color:var(--muted);margin-top:1px}
.yonbtn+.tabs{margin-top:0}
.trow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.trow .back{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav{flex:none;margin-top:-2px;padding:7px 12px;min-height:40px;border:1.5px solid rgba(255,255,255,.6);border-radius:10px;background:transparent;color:#fff;font:600 15px 'Barlow',Arial,sans-serif;cursor:pointer}
.fav[aria-pressed="true"]{background:var(--bright);border-color:var(--bright);color:var(--onbright)}
.ipucu{position:relative;margin:0 0 16px;padding-right:48px;font-size:15px}
.ipucu b{display:block;font-size:16px;margin-bottom:2px}
.ipucu.ipk{display:flex;align-items:center;gap:2px;min-height:52px;padding-top:4px;padding-bottom:4px}
.ipucu.ipk b{display:inline;margin:0;font-size:17px}
.ipi{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--ink);text-decoration:none;-webkit-tap-highlight-color:transparent;border-radius:50%}
.ipi svg{width:24px;height:24px}
.ipi:active{background:var(--soft)}
.adim{margin:12px 0 0;padding:0;list-style:none;counter-reset:a}
.adim li{counter-increment:a;position:relative;padding-left:36px;margin-top:12px;font-size:17px;line-height:1.5}
.adim li:before{content:counter(a);position:absolute;left:0;top:1px;width:26px;height:26px;border-radius:50%;background:var(--bright);color:var(--onbright);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center}
.sv .adim+.svoz{margin-top:14px;color:var(--muted);font-size:15px}
.ipucuk{position:absolute;top:2px;right:2px;width:44px;height:44px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer}
.mb{display:inline-flex;min-width:38px;height:30px;padding:0 8px;border-radius:7px;background:var(--bright);color:var(--onbright);font-size:19px;align-items:center;justify-content:center}
.infob{flex:none;margin-top:-2px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.6);border-radius:50%;color:#fff;text-decoration:none;-webkit-tap-highlight-color:transparent}
.infob:active{background:rgba(255,255,255,.18)}
.infob svg{width:22px;height:22px}
.hk h3{font-size:26px;line-height:1.15;margin:26px 0 8px;font-weight:600}
.hk h3:first-child{margin-top:4px}
.hk p{font-size:17px;line-height:1.6;margin:0}
.hk .svl{margin:12px 0 0}
.hk .svl li{font-size:17px;line-height:1.55;margin-top:10px}
.gear{position:absolute;top:16px;right:10px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:#fff;border-radius:12px;text-decoration:none;-webkit-tap-highlight-color:transparent}
.gear:active{background:rgba(255,255,255,.18)}
.gear svg{width:26px;height:26px}
.set{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px}
.set>b{display:block;font-size:18px;font-weight:600}
.set>small{display:block;color:var(--muted);font-size:14px;margin-top:8px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.setrow b{display:block;font-size:18px;font-weight:600}
.setrow small{display:block;color:var(--muted);font-size:14px}
.sw{flex:none;position:relative;width:60px;height:36px;border:0;border-radius:18px;background:var(--line);cursor:pointer;padding:0}
.sw:after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .18s}
.sw[aria-checked="true"]{background:var(--brand)}
.sw[aria-checked="true"]:after{transform:translateX(24px)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;margin-top:12px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:600 16px 'Barlow',Arial,sans-serif;padding:11px 8px;border-radius:9px;cursor:pointer;min-height:44px}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink)}
.setlink{display:flex;align-items:center;justify-content:space-between;gap:12px;color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent;min-height:44px}
.setlink b{display:block;font-size:18px;font-weight:600}
.setlink small{display:block;color:var(--muted);font-size:14px}

.sv{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px}
.sv.cur{border:2px solid var(--brand)}
.svh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.svad{font-size:28px;line-height:1.1}
.svr{background:var(--bright);color:var(--onbright);border-radius:6px;padding:0 7px;font-size:12px;font-weight:600;letter-spacing:1px}
.svoz{font-size:16px;margin-top:8px}
.svl{margin:10px 0 0;padding:0;list-style:none}
.svl li{position:relative;padding-left:20px;margin-top:6px;font-size:16px}

  {id:"gundogdu", ad:"Gündoğdu", hikaye:[
      {baslik:"Gündoğdu Mahallesi'nin Adı Nereden Geliyor?", baslik_en:"Where Does the Name of the Gündoğdu Neighborhood Come From?",
       metin:"Gündoğdu'nun eski ismi Mihaliç (bazı kaynaklarda Mihalitsi, Miacika veya Mağlıç olarak da geçer). Tahminen 17. yüzyılda, Bursa Mihalitsi'den gelen Rumlar tarafından kurulduğu düşünülüyor. 1924 yılındaki Türk-Yunan nüfus mübadelesi sırasında buradaki Rumlar köyden ayrıldı ve yerlerine Yunanistan'ın Batı Trakya bölgesinden (İskeçe ve Drama civarındaki köylerden) gelen mübadiller yerleştirildi. Köye bugünkü “Gündoğdu” isminin verilmesi de bu döneme, bir idarecinin kararına dayanıyor.",
       metin_en:"Gündoğdu's former name was Mihaliç (in some sources also given as Mihalitsi, Miacika or Mağlıç). It is thought to have been founded around the 17th century by Greeks who came from Mihalitsi in Bursa. During the 1924 Turkish–Greek population exchange, the Greeks here left the village, and in their place settled exchangees from Western Thrace in Greece (from villages around Xanthi and Drama). The village's present name, “Gündoğdu”, also dates to this period and goes back to the decision of an administrator."},
      {baslik:"Bölgede Mübadele Öncesinden Kalan İzler", baslik_en:"Traces Left from Before the Exchange",
       metin:"Gündoğdu, sadece bir isim değişikliği değil; üzerinde Rumlardan kalan fiziksel mirası da barındırıyor:",
       metin_en:"Gündoğdu is not just a change of name; it also holds a physical heritage left by the Greeks:",
       maddeler:[
        {baslik:"Rum Çeşmesi (Koca Çeşme)", baslik_en:"Greek Fountain (Koca Çeşme)",
         metin:"Mahallede bulunan ve halk arasında “Rum Çeşmesi” olarak bilinen 17. yüzyıl yapısı, mübadele öncesi dönemin önemli bir tanığı. Üzerinde Rumca yazılar bulunan bu çeşme, İSU tarafından restore edilerek yeniden hayata kazandırıldı.",
         metin_en:"This 17th-century structure in the neighborhood, known among locals as the “Greek Fountain”, is an important witness to the pre-exchange period. Bearing Greek inscriptions, the fountain was restored by İSU and brought back to life."},
        {baslik:"Gündoğdu Su Kemeri", baslik_en:"Gündoğdu Aqueduct",
         metin:"Paşasuyu kaynağından gelen suyu İzmit'e (antik Nikomedia'ya) taşımak için inşa edilen su kemeri, mahallenin batısında yer alıyor.",
         metin_en:"Built to carry water from the Paşasuyu spring to İzmit (ancient Nicomedia), the aqueduct lies to the west of the neighborhood."}
       ]}
